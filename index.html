<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">

        <!-- css -->
        <link rel="stylesheet" href="./css/style.css">
        <title>El Mehdi Mallah | Portfolio | Home</title>

    <body>
      <!-- header -->
      <header class="section section-1 active">
        <div class="row m-0 p-md-3 h-100 justify-content-center align-items-center">
          <div class="col-md-6 p-md-5">
              <img src="./img/elmehdimallah.png" alt="el mehdi mallah" class="w-100">
          </div>
          <div class="col-md-6 p-md-3">
            <h1 class="display-3 p-0 lh-base fw-bold text-white">Hello World! I'm <span class="text-primary">El Mehdi Mallah</span></h1>
            <p class="text-white fs-5">I'm passionate programmer, I love to create beautiful and functional web applications.</p>
          </div>
        </div>
      </header>
      <!-- main -->
      <main>
        <section class="section section-2 about">about</section>
        <section class="section section-3 portfolio">portfolio</section>
        <section class="section section-4 blogs">blogs</section>
        <section class="section section-5 contact">contact</section>
      </main>
      <!-- buttons -->
      <div class="controle-btns">
        <button class="controle-1 active" type="button" data-section="1"><ion-icon name="home-outline"></ion-icon></button>
        <button class="controle-3" type="button" data-section="2"><ion-icon name="person-outline"></ion-icon></button>
        <button class="controle-2" type="button" data-section="3"><ion-icon name="briefcase-outline"></ion-icon></button>
        <button class="controle-4" type="button" data-section="4"><ion-icon name="newspaper-outline"></ion-icon></button>
        <button class="controle-5" type="button" data-section="5"><ion-icon name="mail-outline"></ion-icon></button>
      </div>
      <!-- jQuery -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
      <!-- ionicones -->
      <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
      <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
      <!-- js -->
      <script type="text/javascript" src="./js/dynamic.js"> </script>
